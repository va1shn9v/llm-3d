[project]
name = "llm-3d"
version = "0.4.0"
description = "Direct RL and evaluation for Blender Python code generation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "trimesh>=4.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "huggingface_hub>=1.5.0",
    "modal>=1.3.5",
]

[project.optional-dependencies]
modal = ["modal>=0.64.0"]
training = ["tinker>=0.1.0", "wandb>=0.19.0"]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
]
all = ["llm-3d[modal,training,dev]"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
