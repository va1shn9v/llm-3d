project_name: "llm-3d"
seed: 42
output_dir: "./output"

storage:
  backend: "hf"
  hf_bucket: "llm3d-data"
  hf_bucket_namespace: ""
  cache_dir: ".cache/hf_data"
  local_manifest_path: "data/manifest.jsonl"
  manifest_key: "datasets/manifest.jsonl"
  mesh_prefix: "meshes"
  modal_volume_mesh_subdir: "meshes"

dataset:
  system_prompt: >
    You are an expert Blender Python developer targeting Blender 4.2.
    Given a text description of a 3D object, write a complete bpy script that
    creates the described geometry, applies sensible materials, and exports the
    result to OBJ.

modal:
  endpoint: ""
  auth_token: ""
  volume_name: "llm3d-data"

reward:
  geometric_weight: 0.9
  format_reward_weight: 0.1
  geometry:
    non_empty:
      enabled: true
      weight: 1.0
    import_bpy:
      enabled: true
      weight: 1.0
    exec_success:
      enabled: true
      weight: 1.0
    min_faces:
      enabled: true
      weight: 1.0
      threshold: 4
    max_vertices:
      enabled: true
      weight: 1.0
      threshold: 100000
    metrics_available:
      enabled: true
      weight: 1.0
    resemblance:
      enabled: true
      weight: 1.0
      threshold: 0.05
  format:
    import_first:
      enabled: true
      weight: 1.0
    has_comments:
      enabled: true
      weight: 1.0
    clears_scene:
      enabled: true
      weight: 1.0
    has_export:
      enabled: true
      weight: 1.0

rl:
  base_model: "Qwen/Qwen2.5-Coder-7B-Instruct"
  lora_rank: 32
  train_mlp: true
  train_attn: true
  train_unembed: true
  init_state_path: ""
  steps: 1000
  batch_size: 16
  num_completions: 8
  learning_rate: 5.0e-6
  temperature: 0.7
  max_new_tokens: 4096
  stop: ["<|im_end|>"]
  checkpoint_every: 100
  log_every: 10
  prompt_path: "datasets/rl_prompts.jsonl"

eval:
  id_path: "datasets/eval_id.jsonl"
  ood_path: ""
  temperature: 0.0
  bootstrap_samples: 10000
  batch_size: 16
  max_concurrent_tinker: 8
  save_details: true
  max_cases_per_test_set: null
  selection:
    output_path: "datasets/eval_id.jsonl"
    manifest_path: ""
    target_size: 500
    max_per_category: 2
  conditions:
    baseline:
      enabled: true
      base_model: ""
      model_path: ""
      temperature: 0.0
      max_new_tokens: 4096
      num_samples: 1
      stop: ["<|im_end|>"]
    candidate:
      enabled: false
      base_model: ""
      model_path: ""
      temperature: 0.0
      max_new_tokens: 4096
      num_samples: 1
      stop: ["<|im_end|>"]
    reference:
      enabled: false
      base_model: ""
      model_path: ""
      temperature: 0.0
      max_new_tokens: 4096
      num_samples: 1
      stop: ["<|im_end|>"]

logging:
  level: "INFO"
  log_dir: "./logs"
  wandb_project: "text-to-3d-rlvr"
  wandb_enabled: false
